name: Publish workspace package

on:
  release:
    types: [created]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Extract package name and version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          PACKAGE_NAME="${TAG%@*}"
          VERSION="${TAG#*@}"

          echo "package=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate package name
        run: |
          case "${{ steps.meta.outputs.package }}" in
            yalidine-sdk|yalidine-astro)
              echo "Valid package"
              ;;
            *)
              echo "Invalid package name in tag"
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: npm ci
      
      - name: Build package (SDK only)
        if: ${{ steps.meta.outputs.package == 'yalidine-sdk' }}
        run: npm run build

      - name: Run tests for target package
        run: npm test -w ${{ steps.meta.outputs.package }}

      - name: Ensure package version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./packages/${{ steps.meta.outputs.package }}/package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.meta.outputs.version }}" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION, tag=${{ steps.meta.outputs.version }}"
            exit 1
          fi
      - name: Debug OIDC id token (no secrets printed)
        run: |
          echo "Node: $(node -v)"
          echo "npm: $(npm -v)"

          TOK_JSON=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL?audience=registry.npmjs.org")

          if [ -z "$TOK_JSON" ]; then
            echo "No response from OIDC endpoint"
            exit 1
          fi

          ID_TOKEN=$(echo "$TOK_JSON" | jq -r '.value')

          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "No id token returned from GitHub OIDC endpoint"
            exit 1
          fi

          echo "OIDC token successfully issued"
          echo "JWT payload:"
          echo "$ID_TOKEN" | cut -d'.' -f2 | base64 --decode | jq '{aud, iss, sub, exp}'

      - name: Publish package (from package dir)
        run: | 
          cd packages/${{ steps.meta.outputs.package }} npm publish --provenance --access public

